<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8">
		<link rel="manifest" href="./manifest.json" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Balloon Quesionnaire</title>
	</head>
	<body>
		<link type="text/css" rel="stylesheet" href="./resources/css/css.css">
		<script type="module" src="./resources/scripts/script.js"></script>
		<script type="module" src="./resources/scripts/phaser.js"></script>
		<!--
		<script type="module" src="./resources/scripts/phaser.min.js"></script>
		-->
		
		<audio src="./resources/sound/Balloon-Pop.ogg" id="sound_break" display="none"></audio>
		<audio src="./resources/sound/Balloon-spawn.ogg" id="sound_spawn" display="none"></audio>
		<audio src="./resources/sound/up.mp3" id="sound_up" display="none"></audio>
		<audio src="./resources/sound/down.mp3" id="sound_down" display="none"></audio>
		<audio src="./resources/sound/poyo.ogg" id="sound_poyo" display="none"></audio>

		<dialog id="load-info">
			loading
		</dialog>
		<div id="canvas-container">
			<canvas id="main-canvas" height="1000" width="1000"></canvas>
			<div class="overlay-div ui-element" id="result-continer">
				<div id="result-0" class="result">
					<img src="./resources/img/balloonR.png" class="img-result">
					<span>文系</span>
					<span id="result-counter-0" class="result-counter">0</span>
				</div>
				<div id="result-1" class="result">
					<img src="./resources/img/balloonG.png" class="img-result">
					<span>理系</span>
					<span id="result-counter-1" class="result-counter">0</span>
				</div>
				<div id="result-2" class="result">
					<img src="./resources/img/balloonB.png" class="img-result">
					<span>その他</span>
					<span id="result-counter-2" class="result-counter">0</span>
				</div>
			</div>
		</div>
		<div id="ui-continer">
			<div id="upper-container" class="ui-element">
				Q. 何系の学部出身ですか？
			</div>
			<div id="lower-container">
			<div id="choices-container">
				<div id="choice-0" class="choice divButton ui-element" >
					<img src="./resources/img/balloonR.png" class="img-choice">
					<span>文系</span>
					<span></span>
				</div>
				<div id="choice-1" class="choice divButton ui-element">
					<img src="./resources/img/balloonG.png" class="img-choice">
					<span>理系</span>
					<span></span>
				</div>
				<div id="choice-2" class="choice divButton ui-element">
					<img src="./resources/img/balloonB.png" class="img-choice">
					<span>その他</span>
					<span></span>
				</div>

			</div>
			<div id="right-container">
				<div id="instructions-container">

					<div id="instruction-0" class="instruction-container divButton ui-element">
						<img src="./resources/img/scrollup.svg">
						上空で結果を確認
						<span></span>
					</div>
					<div id="instruction-1" class="instruction-container divButton ui-element">
						<img src="./resources/img/scrolldown.svg">
						地上に戻る
						<span></span>
					</div>
					<div id="answer-status" display="none">あなたは未回答</div>

				</div>
				<div id="control-panel-container">
					<div class="control divButton ui-element" id="control-add">
						<img src="./resources/img/add.svg">	
						もう一度回答
						<span></span>
					</div>
					<div class="control divButton ui-element" id="control-reset">
						<img src="./resources/img/refresh.svg">
						全回答をリセット
						<span></span>
					</div>
					<div class="control divButton ui-element" id="control-addmany">
						<img src="./resources/img/shadow_add.svg">
						たくさん回答を追加
						<span></span>
					</div>

				</div>
			</div>
		</div>


		</div>

	</body>
	<script>
		if ("serviceWorker" in navigator) {
			navigator.serviceWorker.register("./sw.js").then(
				(registration) => {
					console.log("Service worker registration successful:", registration);
					registration.addEventListener("updatefound", () =>{
						console.warn("New sw available");
						registration.update();
					});
				},
				(error) => {
					console.error(`Service worker registration failed: ${error}`);
				},
			);
		} else {
			console.error("Service workers are not supported.");
		}
	</script>	


</html>
